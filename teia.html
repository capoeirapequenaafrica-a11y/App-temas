<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teia do Universo Capoeira</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,sans-serif;background:#07110c;color:#e8f5e9;min-height:100vh}
  header{padding:12px 14px;border-bottom:1px solid #1b422d;background:#0a1b13}
  h1{font-size:17px;color:#fff}
  .sub{font-size:12px;color:#7ca88f;margin-top:3px}
  .busca{width:100%;margin-top:10px;padding:10px;border-radius:10px;border:1px solid #1b422d;background:#0f261a;color:#e8f5e9;font-size:14px}
  main{display:grid;grid-template-columns:1fr;gap:12px;padding:12px}
  @media(min-width:900px){main{grid-template-columns:1.1fr 1fr}}
  .teia{background:#0f261a;border:1px solid #1b422d;border-radius:14px;padding:6px}
  svg{width:100%;height:auto;display:block}
  .aba-node{cursor:pointer}
  .aba-node circle{fill:#153623;stroke:#00e676;stroke-width:2}
  .aba-node.ativa circle{fill:#00e676}
  .aba-node text{fill:#e8f5e9;font-size:12px;font-weight:700;text-anchor:middle;pointer-events:none}
  .aba-node.ativa text{fill:#07110c}
  .linha{stroke:#1b422d;stroke-width:1.5}
  .lista{background:#0f261a;border:1px solid #1b422d;border-radius:14px;padding:12px;max-height:80vh;overflow:auto}
  .lista h2{font-size:14px;color:#ffd54f;margin-bottom:8px}
  .mod{border-top:1px solid #1b422d;padding:8px 0}
  .mod-nome{font-size:13px;font-weight:700;color:#e8f5e9;cursor:pointer}
  .mod-info{font-size:11px;color:#7ca88f;margin-top:2px}
  .fn{display:flex;justify-content:space-between;font-size:12px;padding:3px 6px;margin-top:2px;border-radius:6px;color:#c8e6c9}
  .fn:hover{background:#153623}
  .fn span{color:#ffd54f;font-family:monospace}
  .oculto{display:none}
  .aviso{font-size:11px;color:#7ca88f;margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>🕸️ Teia do Universo Capoeira</h1>
  <div class="sub">Toque numa aba para ver seus módulos. Cada função mostra a linha exata do index.html.</div>
  <input class="busca" id="busca" placeholder="Buscar função, módulo ou aba (ex.: login, senha, teste)">
</header>
<main>
  <section class="teia"><svg id="svg" viewBox="0 0 600 600"></svg></section>
  <section class="lista" id="lista"></section>
</main>

  const arqs = (aba.arquivos||[]).map(a=>a.toLowerCase());
  return DADOS.modulos.filter(m => arqs.some(a => m.modulo.toLowerCase().includes(a.replace('.js','').replace('aba-','').replace('.js','')) ));
}

function desenhar(){
  svg.innerHTML='';
  const cx=300, cy=300, R=210, r0=55;
  const abas = DADOS.abas;
  abas.forEach((a,i)=>{
    const ang = (-Math.PI/2) + (2*Math.PI*i/abas.length);
    const x = cx + R*Math.cos(ang), y = cy + R*Math.sin(ang);
    svg.appendChild(ns('line',{x1:cx,y1:cy,x2:x,y2:y,class:'linha'}));
  });
  // anéis de teia
  [90,150,210].forEach(rr=>svg.appendChild(ns('circle',{cx,cy,r:rr,fill:'none',stroke:'#1b422d','stroke-width':1})));
  // centro
  const c = ns('circle',{cx,cy,r:r0,fill:'#0a1b13',stroke:'#ffd54f','stroke-width':2});
  svg.appendChild(c);
  const t = ns('text',{x:cx,y:cy-4,'text-anchor':'middle',fill:'#ffd54f','font-size':13,'font-weight':700});
  t.textContent='UC'; svg.appendChild(t);
  const t2 = ns('text',{x:cx,y:cy+12,'text-anchor':'middle',fill:'#7ca88f','font-size':9});
  t2.textContent='index.html'; svg.appendChild(t2);
  abas.forEach((a,i)=>{
    const ang = (-Math.PI/2) + (2*Math.PI*i/abas.length);
    const x = cx + R*Math.cos(ang), y = cy + R*Math.sin(ang);
    const g = ns('g',{class:'aba-node'+(abaAtiva===a.id?' ativa':''), 'data-id':a.id});
    g.appendChild(ns('circle',{cx:x,cy:y,r:38}));
    const tx = ns('text',{x:x,y:y+4}); tx.textContent=a.nome; g.appendChild(tx);
    g.addEventListener('click',()=>{ abaAtiva = abaAtiva===a.id ? null : a.id; desenhar(); renderLista(); });
    svg.appendChild(g);
  });
}

function linkFn(f){ return '<div class="fn"><span>'+f.nome+'()</span><span>linha '+f.linha+'</span></div>'; }

function renderLista(){
  const q = busca.value.trim().toLowerCase();
  let mods = DADOS.modulos;
  if (abaAtiva){
    const aba = DADOS.abas.find(a=>a.id===abaAtiva);
    const ligados = modulosDaAba(aba);
    mods = ligados.length ? ligados : mods;
    lista.innerHTML = '<h2>'+aba.nome+' ('+aba.id+') · '+ (ligados.length? ligados.length+' módulo(s)':'sem módulo direto')+'</h2>' +
      '<div class="aviso">Arquivos da aba: '+(aba.arquivos||[]).join(', ')+'</div>';
  } else {
    lista.innerHTML = '<h2>Todos os módulos ('+mods.length+')</h2>';
  }
  let html='';
  mods.forEach(m=>{
    const fns = m.funcoes.filter(f=>!q || f.nome.toLowerCase().includes(q) || m.modulo.toLowerCase().includes(q));
    if (q && !fns.length && !m.modulo.toLowerCase().includes(q)) return;
    html += '<div class="mod"><div class="mod-nome">'+m.modulo+'</div>'+
      '<div class="mod-info">linhas '+m.inicio+'–'+m.fim+' · '+m.funcoes.length+' função(ões)</div>'+
      fns.slice(0,200).map(linkFn).join('')+'</div>';
  });
  lista.innerHTML += html || '<p class="aviso">Nada encontrado.</p>';
}

busca.addEventListener('input', renderLista);
desenhar(); renderLista();
</script>
</body>
</html>
